<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" width="760" height="240" role="img" aria-label="DSH X402 Wallet logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="x" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4338CA"/>
      <stop offset="1" stop-color="#0891B2"/>
    </linearGradient>
  </defs>

  <!-- icon -->
  <g transform="translate(20 20)">
    <rect x="0" y="0" width="200" height="200" rx="50" fill="url(#bg)"/>
    <rect x="50" y="68" width="100" height="72" rx="12" fill="#FFFFFF"/>
    <rect x="67" y="78" width="66" height="8" rx="4" fill="url(#x)"/>
    <g transform="translate(100 104)">
      <rect x="-7" y="-30" width="14" height="60" rx="7" fill="url(#x)" transform="rotate(45)"/>
      <rect x="-7" y="-30" width="14" height="60" rx="7" fill="url(#x)" transform="rotate(-45)"/>
    </g>
  </g>

  <!-- wordmark -->
  <g transform="translate(252 84)">
    <text x="0" y="0" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="64" font-weight="800" fill="#0F172A" letter-spacing="1">DSH X402</text>
    <text x="2" y="46" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="30" font-weight="600" fill="#64748B" letter-spacing="14">WALLET</text>
  </g>
</svg>
