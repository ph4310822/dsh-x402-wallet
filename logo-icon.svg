<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="DSH X402 Wallet icon">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="x" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4338CA"/>
      <stop offset="1" stop-color="#0891B2"/>
    </linearGradient>
  </defs>

  <!-- badge -->
  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#bg)"/>

  <!-- wallet card -->
  <rect x="136" y="186" width="240" height="170" rx="28" fill="#FFFFFF"/>
  <!-- card slot -->
  <rect x="176" y="206" width="160" height="18" rx="9" fill="url(#x)"/>
  <!-- card chip dots -->
  <circle cx="160" cy="322" r="6" fill="#CBD5E1"/>
  <circle cx="180" cy="322" r="6" fill="#CBD5E1"/>

  <!-- X bars crossing the card -->
  <g transform="translate(256 271)">
    <rect x="-17" y="-72" width="34" height="144" rx="17" fill="url(#x)" transform="rotate(45)"/>
    <rect x="-17" y="-72" width="34" height="144" rx="17" fill="url(#x)" transform="rotate(-45)"/>
  </g>
</svg>
